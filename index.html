:root{--bg:#eef0ff;--n1:#cfd2ff;--n2:#f1d5ff;--ink:#14173a;--mute:#5d6290;--glass:rgba(255,255,255,.72);--line:rgba(80,80,170,.22);--acc:#4b4bd8;--accink:#fff;--me:rgba(75,75,216,.14);--star:60,60,150;--p1:#fff;--p2:#9a8cff;

:root[data-theme="dark"]{--bg:#04051a;--n1:#25206b;--n2:#4a1a5e;--ink:#e9ebff;--mute:#9da3d6;--glass:rgba(18,20,52,.68);--line:rgba(150,160,255,.22);--acc:#8c8cff;--accink:#080a24;--me:rgba(140,140,255,.2);--star:235,238,255;--p1:#ffd9a8;--p2:#6a4bd0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 520px at 85% -8%,var(--n1),transparent 70%),radial-gradient(800px 560px at -10% 108%,var(--n2),transparent 70%),var(--bg);background-attachment:fixed}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
.planet{position:fixed;top:-46px;right:-36px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--p1),var(--p2) 62%,transparent 73%);opacity:.55;z-index:-1;pointer-events:none}

#log{flex:1;overflow-y:auto;padding:8px 16px}

.m.u{margin-left:auto;background:var(--me)}
.m p{margin:0 0 .6em}.m p:last-child{margin:0}
.m ul,.m ol{margin:.2em 0 .6em;padding-left:1.3em}

.mx{overflow-x:auto;max-width:100%;padding:2px 0}

textarea{flex:1;resize:none;height:46px;max-height:120px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--glass);color:var(--ink);font:inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.send{padding:0 18px;border:0;border-radius:14px;background:var(--acc);color:var(--accink);font-weight:600;font-size:15px}
.send:disabled{opacity:.5}
.err{color:#e04646;font-size:14px}
.dots span{animation:b 1.2s infinite;display:inline-block}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
#kb{position:fixed;inset:0;background:rgba(0,0,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
#kb.on{display:flex}
.pn{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:780px;max-height:85%;overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.pn h2{font-size:18px;margin:0 0 4px}
.pn textarea{width:100%;height:90px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.doc{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.top{gap:5px}.top .ib{padding:5px 7px;font-size:15px}

#hs{position:fixed;inset:0;background:rgba(0,0,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}#hs.on{display:flex}
.hr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.hr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hr small{display:block;color:var(--mute)}
#md{margin-top:6px}#md button{font-size:12px}
#st,#tl{position:fixed;inset:0;background:rgba(0,0,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}

.pn input,.pn select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--glass);color:var(--ink);font:inherit;max-width:100%}

.tb{border-collapse:collapse;font-size:13px;width:100%}
.tb td,.tb th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tb td:first-child{text-align:left}
.src .ib{padding:2px 8px;font-size:13px}
#lg{position:fixed;inset:0;background:rgba(0,0,20,.72);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}#lg.on{display:flex}
#lv,#md{display:none}

<script>
(function(){
var KB=[
["Qora tuynuk","black hole chernaya dyra gorizont schwarzschild","Qora tuynuk — tortishishi shunchalik kuchli joyki, hodisalar gorizontidan ichkaridan yorugʻlik ham chiqolmaydi. Gorizont radiusi (Shvartsshild radiusi) r_s = 2GM/c². Quyosh massasi uchun r_s ≈ 3 km. Qora tuynuklar odatda Quyoshdan taxminan 20 baravar ogʻir yulduzlar yadrosi qulaganda hosil boʻladi. Xoking nurlanishi nazariy jihatdan ularning sekin bugʻlanishini bashorat qiladi."],
["Osmon rangi","sky blue sunset rayleigh scattering nebo goluboe zakat","Osmon koʻk, chunki Reley sochilishida yorugʻlik sochilishi intensivligi 1/λ⁴ ga proporsional: koʻk nur (≈450 nm) qizil nurga (≈700 nm) nisbatan taxminan 5–6 marta kuchliroq sochiladi. Quyosh botganda nur atmosferada uzoq yoʻl bosadi, koʻk nur sochilib ketadi va qizil-toʻq sariq ranglar qoladi."],
["Nyuton qonunlari","newton force kuch inertia zakony dinamika","1) Inersiya qonuni: tashqi kuch boʻlmasa jism tinch yoki tekis harakatda qoladi. 2) F = m·a (kuch = massa × tezlanish), birligi 1 N = 1 kg·m/s². 3) Ta’sir va aks ta’sir kuchlari kattaligi teng, yoʻnalishi qarama-qarshi. Impuls p = m·v; yopiq sistemada impuls saqlanadi."],
["Katta portlash","big bang expansion hubble cmb vselennaya","Koinot taxminan 13,8 mlrd yil oldin juda issiq va zich holatdan kengaya boshlagan (Katta portlash). Dalillari: galaktikalarning qochishi (Habbl qonuni v = H₀·d, H₀ ≈ 70 km/s/Mpk), kosmik mikroto‘lqin fon nurlanishi (T ≈ 2,725 K) va yengil elementlar (vodorod, geliy) nisbati."],
["Yorugʻlik va maxsus nisbiylik","speed of light relativity einstein skorost sveta","Yorugʻlik tezligi vakuumda c = 299 792 458 m/s. Maxsus nisbiylikda vaqt sekinlashadi: Δt = γΔt₀, γ = 1/√(1 − v²/c²). Massa va energiya bogʻliq: E = mc². Hech bir massali jism c ga yetolmaydi."],
["Umumiy nisbiylik","general relativity gravity spacetime gravitational waves ligo","Umumiy nisbiylikda tortishish fazovaqtning egriligidir; Eynshteyn tenglamasi G_μν + Λg_μν = (8πG/c⁴)T_μν. Tasdiqlari: Merkuriy perigeliy siljishi, yorugʻlikning egilishi, gravitatsion toʻlqinlar (LIGO, 2015), GPS soatlariga tuzatish."],
["Butun olam tortishish qonuni","gravity newton gravitation kosmik tezlik orbital velocity escape","F = G·m₁m₂/r², G = 6,674·10⁻¹¹ N·m²/kg². Yer yuzida g ≈ 9,81 m/s². Birinchi kosmik tezlik v₁ = √(GM/R) ≈ 7,9 km/s, ikkinchi (qochish) tezligi v₂ = √(2GM/R) ≈ 11,2 km/s."],
["Kepler qonunlari","kepler orbit planet ellipse period zakony keplera","1) Sayyoralar Quyosh fokusda boʻlgan ellips boʻylab harakatlanadi. 2) Radius-vektor teng vaqtda teng yuza chizadi. 3) T² ∝ a³; aniq ifoda T² = 4π²a³/(GM), bu yerda a — katta yarim oʻq."],
["Quyosh","sun solar star sirt temperatura solnce","Quyosh G2V spektr sinfidagi yulduz, yoshi ≈ 4,6 mlrd yil. Massasi 1,989·10³⁰ kg, radiusi ≈ 696 000 km, sirt harorati ≈ 5772 K, yadro harorati ≈ 15 mln K. Energiya vodorodning geliyga termoyadro sintezidan olinadi. Yergacha masofa 1 a.b. ≈ 149,6 mln km; yorugʻlik ≈ 8 daqiqa 20 s da yetib keladi."],
["Yulduzlar evolyutsiyasi","stellar evolution supernova white dwarf neutron star red giant","Gaz-chang tumanligi → protoyulduz → asosiy ketma-ketlik (vodorod yonadi) → qizil gigant. Quyoshga oʻxshash yulduzlar oq mitti boʻladi (Chandrasekar chegarasi ≈ 1,4 M☉). Juda massiv yulduzlar oʻta yangi yulduz sifatida portlab, neytron yulduz yoki qora tuynuk qoldiradi."],
["Quyosh sistemasi","solar system planets planeta sistema pluton","8 ta sayyora: Merkuriy, Venera, Yer, Mars, Yupiter, Saturn, Uran, Neptun. Ichki sayyoralar toshsimon, tashqilari gaz va muz gigantlari. Pluton 2006-yilda mitti sayyora deb qayta tasniflangan. Mars va Yupiter orasida asteroidlar belbogʻi, Neptundan narida Kuyper belbogʻi bor."],
["Somon yoʻli va galaktikalar","milky way galaxy andromeda galaktika","Somon yoʻli — spiral galaktika, yuz milliardlab yulduzdan iborat, diametri ≈ 100 000 yorugʻlik yili. Quyosh markazdan ≈ 26 000 yorugʻlik yili uzoqlikda. Andromeda galaktikasi ≈ 2,5 mln yorugʻlik yili narida va bir necha mlrd yildan keyin Somon yoʻli bilan qoʻshilishi kutilmoqda."],
["Qorongʻu materiya va energiya","dark matter dark energy temnaya materiya energiya","Koinot tarkibi: ≈ 5% oddiy modda, ≈ 27% qorongʻu materiya, ≈ 68% qorongʻu energiya. Qorongʻu materiya galaktikalarning aylanish egri chiziqlari va gravitatsion linzalanishdan sezilgan; qorongʻu energiya koinot kengayishining tezlashishini tushuntiradi."],
["Termodinamika","thermodynamics entropy ideal gas termodinamika gaz","Birinchi qonun: ΔU = Q − A. Ikkinchi qonun: yopiq sistemada entropiya kamaymaydi. Ideal gaz holat tenglamasi pV = νRT, R = 8,314 J/(mol·K). Kelvin shkalasi: T(K) = t(°C) + 273,15."],
["Elektr va magnetizm","electricity magnetism coulomb ohm maxwell lorentz elektr magnit","Kulon qonuni F = k·q₁q₂/r², k ≈ 8,99·10⁹ N·m²/C². Om qonuni I = U/R. Quvvat P = U·I. Lorens kuchi F = q(E + v×B). Maksvell tenglamalari elektr, magnit va yorugʻlikni yagona nazariyaga birlashtiradi."],
["Kvant mexanikasi","quantum planck uncertainty schrodinger kvant foton","Foton energiyasi E = hν, h = 6,626·10⁻³⁴ J·s. De Broyl toʻlqin uzunligi λ = h/p. Noaniqlik munosabati Δx·Δp ≥ ħ/2. Shryodinger tenglamasi iħ ∂ψ/∂t = Ĥψ."],
["Energiya, ish va quvvat","energy work power kinetic potential energiya rabota","Kinetik energiya E_k = mv²/2, potensial energiya E_p = mgh, ish A = F·s·cos α, quvvat P = A/t. Mexanik energiya (ishqalanishsiz) saqlanadi."],
["Kinematika","kinematics velocity acceleration free fall kinematika skorost","Tekis tezlanuvchan harakat: v = v₀ + at; s = v₀t + at²/2; v² = v₀² + 2as. Erkin tushishda a = g ≈ 9,81 m/s². Gorizontga burchak ostida otilgan jismning uchish masofasi L = v₀² sin2α / g."],
["Tebranish va toʻlqinlar","oscillation pendulum wave doppler redshift mayatnik volna","Prujinali mayatnik T = 2π√(m/k); matematik mayatnik T = 2π√(l/g). Toʻlqin tezligi v = λ·f. Doppler effekti: yulduz uzoqlashsa spektr qizilga siljiydi, qizil siljish z = Δλ/λ."],
["Optika va teleskoplar","optics lens telescope snell diffraction teleskop linza","Snellius qonuni: n₁ sinθ₁ = n₂ sinθ₂. Yupqa linza: 1/F = 1/d + 1/f. Teleskop ajrata olish chegarasi θ ≈ 1,22 λ/D. Hubble (1990) va James Webb (2021-yil dekabr, infraqizil) kosmik teleskoplaridir."],
["Neytron yulduzlar va pulsarlar","neutron star pulsar magnetar nejtronnaya zvezda","Neytron yulduz: massasi ≈ 1,4–2 M☉, radiusi ≈ 10–12 km, zichligi ≈ 10¹⁷ kg/m³. Tez aylanuvchi neytron yulduz nurlanishi chaqnash sifatida qayd etilsa, u pulsar deyiladi. Juda kuchli magnit maydonli turi magnetar."],
["Ekzosayyoralar","exoplanet transit habitable zone ekzoplaneta","Ekzosayyoralar boshqa yulduzlar atrofidagi sayyoralar; 5000 dan ortiq topilgan. Asosiy usullar: tranzit (yulduz yorugʻligining pasayishi) va radial tezlik (yulduzning Doppler siljishi). Yashash zonasi — suyuq suv boʻlishi mumkin boʻlgan masofa."],
["Kosmonavtika tarixi","spaceflight sputnik gagarin apollo tsiolkovsky kosmonavtika","Birinchi sunʼiy yoʻldosh Sputnik-1 — 1957-yil 4-oktyabr. Yuriy Gagarin — 1961-yil 12-aprel, birinchi inson kosmosda. Apollo 11 — 1969-yil 20-iyul, Oyga qadam. Siolkovskiy formulasi: Δv = v_e·ln(m₀/m_f)."],
["Oy va tutilishlar","moon eclipse tides luna zatmenie","Oy radiusi ≈ 1737 km, Yergacha oʻrtacha masofa ≈ 384 400 km. Quyosh tutilishida Oy Quyosh va Yer orasiga, Oy tutilishida Yer Quyosh va Oy orasiga tushadi. Okean suv toshqinlari asosan Oy tortishishi tufayli."],
["Astronomik masofalar","light year parsec parallax svetovoj god parsek","1 yorugʻlik yili ≈ 9,461·10¹² km. 1 parsek ≈ 3,26 yorugʻlik yili. Paralaks usuli: d (pk) = 1/p (burchak soniya). Eng yaqin yulduz Proksima Kentavra ≈ 4,24 yorugʻlik yili uzoqda."],
["Quyosh energiyasi","sun fusion proton chain termoyadro fuziya","Quyoshda proton–proton zanjiri orqali 4 ta vodorod yadrosi 1 ta geliyga aylanadi; massa defekti ≈ 0,7%, ΔE = Δm·c². Quyosh quvvati ≈ 3,83·10²⁶ W, har sekundda ≈ 600 mln tonna vodorod geliyga aylanadi. Yadrodagi energiya sirtga chiqishi uchun yuz minglab yil ketadi."],
["Merkuriy, Uran, Neptun","mercury uranus neptune merkuriy uran neptun","Merkuriy: eng kichik va Quyoshga eng yaqin sayyora, harorat ≈ −180 dan +430 °C gacha, atmosferasi deyarli yoʻq. Uran oʻz oʻqi atrofida ≈ 98° ogʻgan, yonboshlab aylanadi. Neptunda shamol tezligi 2000 km/soatga yaqin yetadi."],
["Venera","venus venera greenhouse parnik","Venera atmosferasi ≈ 96% CO₂, sirt bosimi ≈ 92 atm, harorat ≈ 465 °C — kuchli issiqxona effekti. U teskari yoʻnalishda sekin aylanadi: bir sutka (≈ 243 Yer kuni) uning yilidan (≈ 225 kun) uzoq."],

["Radioaktivlik va yadro","radioactivity half-life fission fusion alpha beta gamma radioaktivlik yadro","Radioaktiv yemirilish qonuni: N = N₀·2^(−t/T), T — yarim yemirilish davri. α — geliy yadrosi, β — elektron yoki pozitron, γ — yuqori energiyali foton. Yadro boʻlinishi (U-235) va sintezi massa defekti hisobiga energiya beradi: E = Δm·c²."],

["Elektr zanjirlar","circuit series parallel capacitor joule elektr zanjir kondensator","Ketma-ket: R = R₁ + R₂, tok bir xil. Parallel: 1/R = 1/R₁ + 1/R₂, kuchlanish bir xil. Joul–Lens: Q = I²Rt. Kondensator C = q/U, energiyasi W = CU²/2. Induktivlikda W = LI²/2."],
["Elektromagnit toʻlqinlar spektri","electromagnetic spectrum radio infrared ultraviolet xray gamma spektr","Uzun toʻlqindan qisqasiga: radio, mikroto‘lqin, infraqizil, koʻrinadigan yorugʻlik (≈ 400–700 nm), ultrabinafsha, rentgen, gamma. Hammasi vakuumda c tezlikda tarqaladi; c = λ·f. Astronomlar har bir diapazonda turli jarayonlarni kuzatadi."],

["Kritik zichlik va koinot geometriyasi","critical density friedmann flat universe kritik zichlik","Kritik zichlik ρ_c = 3H²/(8πG) ≈ 9·10⁻²⁷ kg/m³ (≈ 5 proton/m³). Oʻlchovlar koinot geometriyasi deyarli tekis ekanini koʻrsatadi. Fridman tenglamalari koinot kengayishini zichlik va egrilikka bogʻlaydi."],

["Mashhur osmon jismlari","sirius betelgeuse vega polaris orion pleiades betelgeyze","Sirius — tungi osmonning eng yorqin yulduzi (≈ 8,6 yorugʻlik yili). Betelgeyze — Orion turkumidagi qizil oʻta gigant. Vega — Lyra turkumida. Qutb yulduzi (Polaris) shimoliy qutb yaqinida. Pleyadalar — ochiq yulduz toʻp. Orion tumanligi — yulduz tugʻiladigan hudud."],

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function tex(t,d){
 if(!window.katex)return '<code>'+esc(t)+'</code>';
 try{var h=katex.renderToString(t,{output:'mathml',displayMode:d,throwOnError:false});return d?'<div class="mx">'+h+'</div>':h}catch(e){return '<code>'+esc(t)+'</code>'}
}
function render(s){
 var M=[];
 s=s.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\$\n]+?)\$/g,function(m,a,b,c,d){var D=a!==undefined||b!==undefined;M.push([a||b||c||d,D]);return '\u0000'+(M.length-1)+'\u0000'});
 var o='',l=null;
 function cl(){if(l){o+='</'+l+'>';l=null}}
 s.split('\n').forEach(function(x){var m;
  if(m=x.match(/^\s*[-*•]\s+(.*)/)){if(l!=='ul'){cl();o+='<ul>';l='ul'}o+='<li>'+inl(m[1])+'</li>'}
  else if(m=x.match(/^\s*\d+[.)]\s+(.*)/)){if(l!=='ol'){cl();o+='<ol>';l='ol'}o+='<li>'+inl(m[1])+'</li>'}
  else if(m=x.match(/^#{1,4}\s+(.*)/)){cl();o+='<h4>'+inl(m[1])+'</h4>'}
  else if(!x.trim()){cl()}
  else{cl();o+='<p>'+inl(x)+'</p>'}});
 cl();
 return o.replace(/\u0000(\d+)\u0000/g,function(m,i){return tex(M[i][0],M[i][1])});
}

function build(){
 var all=KB.map(function(k){return{src:k[0],text:k[2],k:k[0]+' '+k[1]}});
 DOCS.forEach(function(d){chunkText(d.x).forEach(function(c){all.push({src:'📄 '+d.t,text:c,k:d.t})})});
 var df={},tot=0;
 all.forEach(function(c){var tf={},ts=tok(c.text).concat(tok(c.k),tok(c.k),tok(c.k));ts.forEach(function(w){tf[w]=(tf[w]||0)+1});c.tf=tf;c.len=ts.length;tot+=c.len;Object.keys(tf).forEach(function(w){df[w]=(df[w]||0)+1})});
 IDX={c:all,df:df,avg:tot/all.length}
}
function search(qs){
 if(!IDX)build();
 var N=IDX.c.length,sc=IDX.c.map(function(c){var s=0;qs.forEach(function(w){var f=c.tf[w];if(!f)return;var d=IDX.df[w],idf=Math.log(1+(N-d+.5)/(d+.5));s+=idf*f*2.2/(f+1.2*(.5+.5*c.len/IDX.avg))});return[s,c]});
 sc.sort(function(a,b){return b[0]-a[0]});
 var top=sc[0][0];if(top<1.2)return[];
 return sc.filter(function(x,i){return i<3&&x[0]>=.4*top}).map(function(x){return x[1]});
}

 var rd=res.body.getReader(),dc=new TextDecoder(),buf='',txt='';
 while(true){var x=await rd.read();if(x.done)break;buf+=dc.decode(x.value,{stream:true});var ls=buf.split('\n');buf=ls.pop();

 if(CLOUD)CLOUD.doc(c.id).set({title:c.title,ts:c.ts,msgs:JSON.stringify(c.msgs)}).then(function(){CLOUDOK=true;hsr()}).catch(function(){CLOUDOK=false;hsr()});
}
